name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Set node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Prepare is needed, because it generate types
        run: pnpm dev:prepare

      - name: Lint
        run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Set node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Prepare is needed, because it generate types
        run: pnpm dev:prepare

      - name: Typecheck
        run: pnpm typecheck

  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: grafana/setup-k6-action@v1.2.2
        with:
          k6-version: 2.3.0

      - name: Check retained heap under load
        run: pnpm test:memory

      - name: Upload memory diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: memory-regression
          path: reports/memory
          if-no-files-found: ignore
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Set node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps --only-shell

      - name: Prepare is needed, because it generate types
        run: pnpm dev:prepare

      - name: Run tests
        run: pnpm vitest run --dir ./test

      - name: Run type tests
        run: pnpm vitest --dir ./test --typecheck.only --typecheck.ignoreSourceErrors

  collector-node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.22.3
          - 24.15.0
          - 26.13.0
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Set node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Prepare is needed, because it generate types
        run: pnpm dev:prepare

      - name: Run outbound collector tests
        run: pnpm vitest run test/collector-channels.spec.ts test/collector-wrappers.spec.ts test/collector-selection.spec.ts

  collector-runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: bun
            preset: bun
            command: bun run test/runtime/collector.runtime.mjs
            playground: bun run test/runtime/playground.e2e.mjs
          - runtime: deno
            preset: deno-server
            command: deno run -A test/runtime/collector.runtime.mjs
            playground: deno run -A test/runtime/playground.e2e.mjs
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Set node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Prepare is needed, because it generate types
        run: pnpm dev:prepare

      - name: Set up Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2.2.0

      - name: Set up Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2.0.5

      - name: Build the playground
        env:
          NITRO_PRESET: ${{ matrix.preset }}
        run: pnpm --dir playground exec nuxt build

      - name: Run outbound collector tests
        run: ${{ matrix.command }}

      - name: Run the playground end-to-end tests
        run: ${{ matrix.playground }}
