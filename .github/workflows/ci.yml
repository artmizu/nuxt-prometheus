name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Set node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Prepare is needed, because it generate types
        run: pnpm dev:prepare

      - name: Lint
        run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Set node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Prepare is needed, because it generate types
        run: pnpm dev:prepare

      - name: Typecheck
        run: pnpm typecheck

  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: grafana/setup-k6-action@v1.2.2
        with:
          k6-version: 2.3.0

      - name: Check retained heap under load
        run: pnpm test:memory

      - name: Upload memory diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: memory-regression
          path: reports/memory
          if-no-files-found: ignore
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Set node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps --only-shell

      - name: Prepare is needed, because it generate types
        run: pnpm dev:prepare

      - name: Run tests
        run: pnpm vitest run --dir ./test

      - name: Run type tests
        run: pnpm vitest --dir ./test --typecheck.only --typecheck.ignoreSourceErrors
